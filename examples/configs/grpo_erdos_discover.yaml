# TTT-Discover Erdős — Nemotron-3-Super-120B-A12B
# 10 nodes: 2 inference + 8 training, CP=2 for 16k seq len
defaults: "grpo_superv3.yaml"

grpo:
  num_prompts_per_step: 8
  num_generations_per_prompt: 63
  max_num_steps: 50
  max_rollout_turns: 1
  remove_constant_reward_groups: true
  val_period: 0
  val_at_start: false
  val_at_end: false
  adv_estimator:
    name: entropic_adaptive_beta
    gamma: 0.6931471805599453

loss_fn:
  kl_penalty_coef: 0.1
  ratio_clip: 0.2
  token_level_loss: false

policy:
  model_name: "/home/shared/models/NVIDIA-Nemotron-3-Super-120B-A12B-Base-BF16"
  tokenizer:
    name: "/home/shared/models/NVIDIA-Nemotron-3-Super-120B-A12B-Base-BF16"
    chat_template_kwargs: null
  max_total_sequence_length: 16384
  train_global_batch_size: 504
  train_micro_batch_size: 1
  logprob_batch_size: 1

  generation:
    colocated:
      enabled: false
      resources:
        num_nodes: 2
        gpus_per_node: 8
    max_new_tokens: 15360
    vllm_cfg:
      async_engine: false
      tensor_parallel_size: 8
      gpu_memory_utilization: 0.85
      max_model_len: 16384

  megatron_cfg:
    tensor_model_parallel_size: 4
    pipeline_model_parallel_size: 1
    context_parallel_size: 2
    expert_model_parallel_size: 8
    sequence_parallel: true
    activation_checkpointing: true
    empty_unused_memory_level: 2
    optimizer_cpu_offload: true
    optimizer:
      optimizer_cpu_offload: true
      optimizer_offload_fraction: 1.0

  dynamic_batching:
    enabled: false

  lora_cfg:
    enabled: false

optimizer:
  lr: 4.0e-5

data:
  shuffle: false
  max_input_seq_length: 16384

env:
  erdos_discovery:
    num_initial_states: 16
    num_groups_per_step: 8
    sandbox_timeout: 1000
  should_use_nemo_gym: false

cluster:
  gpus_per_node: 8
  num_nodes: 10

logger:
  log_dir: "results/erdos-120b"
  wandb_enabled: true
  wandb:
    project: "ttt-discover-erdos"
    name: "nemotron-120b-16k-10node"
  tensorboard_enabled: false
  mlflow_enabled: false
  swanlab_enabled: false

checkpointing:
  enabled: false
  checkpoint_dir: "results/erdos-120b"
  save_period: 999999
  checkpoint_must_save_by: null
  model_save_format: "safetensors"
  save_consolidated: false
