# Debug config: Qwen2.5-1.5B, 1 node, 16k seq len, 15 steps
# Purpose: reproduce step 10 hang at small scale
defaults: "grpo_math_1B.yaml"

grpo:
  num_prompts_per_step: 4
  num_generations_per_prompt: 8
  max_num_steps: 15
  max_rollout_turns: 1
  remove_constant_reward_groups: true
  val_period: 0
  val_at_start: false
  val_at_end: false
  adv_estimator:
    name: entropic_adaptive_beta
    gamma: 0.6931471805599453

loss_fn:
  kl_penalty_coef: 0.1
  ratio_clip: 0.2
  token_level_loss: false

policy:
  model_name: "Qwen/Qwen2.5-1.5B-Instruct"
  tokenizer:
    name: "Qwen/Qwen2.5-1.5B-Instruct"
    chat_template_kwargs: null
  max_total_sequence_length: 4096
  train_global_batch_size: 32
  train_micro_batch_size: 4
  dtensor_cfg:
    enabled: true
    tensor_parallel_size: 1
    sequence_parallel: false
    cpu_offload: false
    activation_checkpointing: true
  lora_cfg:
    enabled: true
    rank: 16
    alpha: 1.0
    dropout: 0.0
  generation:
    backend: "vllm"
    max_new_tokens: 3072
    temperature: 1.0
    top_p: 1.0
    stop_token_ids: null
    stop_strings: null
    vllm_cfg:
      async_engine: false
      tensor_parallel_size: 1
      pipeline_parallel_size: 1
      expert_parallel_size: 1
      gpu_memory_utilization: 0.6
      max_model_len: 4096
  dynamic_batching:
    enabled: false

optimizer:
  name: adamw
  lr: 1.0e-4

data:
  shuffle: false

env:
  erdos_discovery:
    num_initial_states: 8
    puct_seed_batch_size: 4
    sandbox_timeout: 120
  should_use_nemo_gym: false

cluster:
  gpus_per_node: 8
  num_nodes: 1

logger:
  log_dir: "logs/erdos-debug-16k"
  wandb_enabled: false
  tensorboard_enabled: false
  mlflow_enabled: false
  swanlab_enabled: false

checkpointing:
  enabled: false
  checkpoint_dir: "logs/erdos-debug-16k"
  save_period: 999999
  checkpoint_must_save_by: null
