# TTT-Discover DEBUG config.
# Inherits from grpo_math_1B.yaml for all defaults.
# Overrides: entropic advantages, inline reward, small batch, 5 steps.
defaults: "grpo_math_1B.yaml"

grpo:
  num_prompts_per_step: 4
  num_generations_per_prompt: 8
  max_num_epochs: 1
  max_num_steps: 5
  max_rollout_turns: 1
  remove_constant_reward_groups: true
  adv_estimator:
    name: entropic_adaptive_beta
    gamma: 0.6931471805599453

loss_fn:
  kl_penalty_coef: 0.1
  ratio_clip: 0.2
  token_level_loss: false

policy:
  model_name: "Qwen/Qwen2.5-1.5B-Instruct"
  max_total_sequence_length: 4096
  train_global_batch_size: 32
  train_micro_batch_size: 4

  dtensor_cfg:
    enabled: true
    cpu_offload: false
    activation_checkpointing: true
    sequence_parallel: false

  lora_cfg:
    enabled: true
    rank: 16
    alpha: 1.0
    dropout: 0.0

  dynamic_batching:
    enabled: false

  generation:
    backend: "vllm"
    max_new_tokens: 2048
    temperature: 1.0
    top_p: 1.0
    stop_token_ids: null
    stop_strings: null
    vllm_cfg:
      async_engine: false
      tensor_parallel_size: 1
      pipeline_parallel_size: 1
      expert_parallel_size: 1
      gpu_memory_utilization: 0.6
      max_model_len: ${policy.max_total_sequence_length}

optimizer:
  name: adamw
  lr: 1.0e-4

data:
  shuffle: false

env:
  erdos_discovery:
    num_initial_states: 8
    num_groups_per_step: 4
    sandbox_timeout: 120

checkpointing:
  enabled: false

logger:
  log_dir: "logs/erdos-debug"
  wandb_enabled: false
  tensorboard_enabled: false
  mlflow_enabled: false
  swanlab_enabled: false
